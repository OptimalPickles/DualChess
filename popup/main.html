<html>
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <!-- loading, "open a chess.com page", errors -->
        <p id="status" class="status">Loading…</p>

        <!-- only shown until we know your username -->
        <div id="who-are-you" hidden>
            <p id="who-are-you-text">Which of these is you?</p>
            <div id="who-are-you-candidates"></div>
            <input id="who-are-you-input" type="text" placeholder="or type your chess.com username" />
            <button id="who-are-you-save" type="button">Save</button>
        </div>

        <div id="main" hidden>
            <!-- shared by both views -->
            <header class="header">
                <div class="header-row">
                    <div id="views" class="seg" role="group" aria-label="View">
                        <button type="button" data-view="me" aria-pressed="false">Me</button>
                        <button type="button" data-view="compare" aria-pressed="false">Compare</button>
                    </div>
                    <span id="updated" class="updated"></span>
                </div>
                <!-- saved in chrome.storage.local -->
                <label class="tc"><span class="sr">Time control</span>
                    <select id="ctl-time">
                        <option value="auto">auto</option>
                        <option value="bullet">Bullet</option>
                        <option value="blitz">Blitz</option>
                        <option value="rapid">Rapid</option>
                        <option value="daily">Daily</option>
                    </select>
                </label>
            </header>

            <main class="body">
                <p id="no-opponent" class="note" hidden>No opponent on this page</p>

                <!-- fair play: a game is in progress, so this is all the body shows -->
                <div id="lock" class="lock" role="status" hidden>
                    <span class="pulse" aria-hidden="true"></span>
                    <p><strong>Game in progress.</strong> Stats will appear when it ends.</p>
                </div>

                <div id="view-me" class="view" hidden>
                    <section id="me-level" class="player player--solo"></section>
                    <ul id="me-lines" class="lines"></ul>
                    <button type="button" id="open-stats" class="link">Full stats ↗</button>
                </div>

                <div id="view-compare" class="view" hidden>
                    <section id="players" class="players">
                        <div id="col-0" class="player"></div>
                        <div id="col-1" class="player player--opp"></div>
                    </section>
                    <section id="prediction" class="prediction">
                        <p id="prediction-text"></p>
                        <div class="bar" aria-hidden="true"><span id="bar-you" class="you"></span><span class="opp"></span></div>
                    </section>
                    <ul id="compare-lines" class="lines"></ul>
                    <details id="more" class="more">
                        <summary>More details</summary>
                        <table id="more-table"></table>
                        <div id="more-extra" class="more-extra"></div>
                    </details>
                    <button type="button" id="open-compare" class="link">Full comparison ↗</button>
                </div>
            </main>

            <footer class="foot">
                <button id="change-account" type="button">Not you? Change tracked account</button>
            </footer>
        </div>

        <!-- performance.js, fairplay.js, race.js, rivalry.js, data.js, details.js, tabs.js, then
             popup.js. each uses the ones before it -->
        <script src="../scripts/performance.js"></script>
        <script src="../scripts/fairplay.js"></script>
        <script src="../scripts/race.js"></script>
        <script src="../scripts/rivalry.js"></script>
        <script src="../scripts/data.js"></script>
        <script src="../scripts/details.js"></script>
        <script src="../scripts/tabs.js"></script>
        <script src="popup.js"></script>
    </body>
</html>
