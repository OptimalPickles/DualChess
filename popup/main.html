<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>DualChess</title>
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <!-- loading, "open a chess.com page", errors -->
        <p id="status" class="status">Loading…</p>

        <!-- only shown until we know your username -->
        <div id="who-are-you" hidden>
            <p id="who-are-you-text">Which of these is you?</p>
            <div id="who-are-you-candidates"></div>
            <input id="who-are-you-input" type="text" placeholder="or type your chess.com username" />
            <button id="who-are-you-save" type="button">Save</button>
        </div>

        <div id="main" hidden>
            <!-- shared by both views -->
            <header class="header">
                <div id="views" class="tabs" role="group" aria-label="View">
                    <button type="button" data-view="me" aria-pressed="false">Me</button>
                    <button type="button" data-view="compare" aria-pressed="false">Compare</button>
                </div>
                <!-- saved in chrome.storage.local -->
                <label class="tc"><span class="sr">Time control</span>
                    <select id="ctl-time">
                        <option value="auto">Auto</option>
                        <option value="bullet">Bullet</option>
                        <option value="blitz">Blitz</option>
                        <option value="rapid">Rapid</option>
                        <option value="daily">Daily</option>
                    </select>
                </label>
                <span id="updated" class="updated"></span>
            </header>

            <main>
                <p id="no-opponent" class="note" hidden>No opponent on this page</p>

                <!-- fair play: a game is in progress, so this is all the body shows -->
                <div id="lock" class="body" role="status" hidden>
                    <div class="card lock">
                        <span class="pulse" aria-hidden="true"></span>
                        <p><strong>Game in progress.</strong> Stats will appear when it ends.</p>
                    </div>
                </div>

                <div id="view-me" class="body" hidden>
                    <section id="me-level" class="strip y"></section>
                    <ul id="me-lines" class="card lines"></ul>
                    <button type="button" id="open-stats" class="cta">Full stats ↗</button>
                </div>

                <div id="view-compare" class="body" hidden>
                    <!-- one strip per player, the opponent on top as at a board: the initial,
                         the name over "Performance 2009 ± 85", the official rating big on the right -->
                    <div id="card-1" class="strip o"></div>
                    <p id="cmp-problem" class="note" hidden></p>
                    <div id="card-0" class="strip y"></div>
                    <section id="win" class="card">
                        <h3>Win chance</h3>
                        <div id="wbar" class="wbar" role="img"><span id="wbar-y" class="y"></span><span id="wbar-d" class="d"></span><span id="wbar-o" class="o"></span></div>
                        <div class="legend"><span id="win-y-name"></span><span>draw <span id="win-d"></span></span><span id="win-o-name"></span></div>
                        <p id="based-on" class="note"></p>
                    </section>
                    <!-- 5+ games together in this time class -->
                    <section id="against" class="card" hidden>
                        <h3 id="against-title"></h3>
                        <div class="tiles">
                            <div id="against-levels" class="tile"></div>
                            <div id="against-scored" class="tile"></div>
                        </div>
                    </section>
                    <div class="actions">
                        <details id="more" class="more"><summary>More details</summary></details>
                        <button type="button" id="open-compare" class="cta">Full comparison ↗</button>
                    </div>
                    <!-- shown by css while the details above are open -->
                    <div id="more-body" class="card more-body"><p class="note">Coming soon. This part is still being worked on.</p></div>
                </div>
            </main>

            <footer class="foot">
                <button id="change-account" type="button">Not you? Change tracked account</button>
            </footer>
        </div>

        <!-- performance.js, fairplay.js, race.js, rivalry.js, data.js, details.js, tabs.js, then
             popup.js. each uses the ones before it -->
        <script src="../scripts/performance.js"></script>
        <script src="../scripts/fairplay.js"></script>
        <script src="../scripts/race.js"></script>
        <script src="../scripts/rivalry.js"></script>
        <script src="../scripts/data.js"></script>
        <script src="../scripts/details.js"></script>
        <script src="../scripts/tabs.js"></script>
        <script src="popup.js"></script>
    </body>
</html>
